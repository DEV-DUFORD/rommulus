      - name: Smoke — player process launches under a sanitized PATH (usage exit 2)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $stageBin = Join-Path $env:GITHUB_WORKSPACE "dist/player-win64-software-only/bin"
          # Deliberately NOT the msys2 shell: setup-msys2 puts C:\msys64\ucrt64\bin
          # (and friends) on the step PATH, and the PE loader searches PATH — so an
          # MSYS shell would let a MISSING staged DLL (e.g. libwinpthread-1.dll or
          # SDL3.dll) resolve from the toolchain and mask a broken closure. This
          # PowerShell step sanitizes the loader PATH instead: ONLY the staged
          # artifact bin + the Windows system directories are visible. No
          # arguments: main() prints usage and returns 2 BEFORE any SDL_Init, but
          # the PE loader must first resolve the entire import closure (KERNEL32/
          # UCRTBASE from System32 + SDL3.dll/libwinpthread-1.dll beside the exe)
          # — so exit 2 proves the FULL staged closure loads. A missing DLL would
          # be a load failure (0xC0000135), not usage output. Full E2E request
          # fixtures are the next lane's scope.
          $env:PATH = "$stageBin;$env:SystemRoot\System32;$env:SystemRoot"
          Write-Host "sanitized loader PATH: $env:PATH"
          $ErrorActionPreference = "Continue"
          $err = & (Join-Path $stageBin "rommulus-player.exe") 2>&1
          $rc = $LASTEXITCODE
          $ErrorActionPreference = "Stop"
          Write-Host "player exit code: $rc"
          $err | ForEach-Object { Write-Host $_ }
          if ($rc -ne 2) { throw "expected usage exit 2, got $rc" }
          if (($err -join "`n") -notmatch 'usage:') { throw "usage message missing from player output" }
          Write-Host "OK: rommulus-player.exe launched and printed usage (full staged import closure resolves without the toolchain on PATH)"
          $global:LASTEXITCODE = 0

      - name: Smoke — repeated native load/retro_api_version/init/deinit (no ROM content)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          STAGE="dist/player-win64-software-only"
          SMOKE_DIR="$RUNNER_TEMP/core-smoke"
          mkdir -p "$SMOKE_DIR"
          # Build the committed smoke executable with the SAME UCRT64 toolchain:
          # it LoadLibrary()s a core DLL, asserts retro_api_version()==1, and
          # cycles retro_init()/retro_deinit() — no ROM content is ever loaded.
          # The import-closure integrity of every staged image was already
          # proven by the recursive PE audit above; this step proves the
          # exported entry points are callable and stable across repeated
          # load/unload (the per-core gate's init/deinit smoke, plans/
          # WINDOWS_IMPL.md section 6.4 item 5).
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -static-libgcc \
            -o "$SMOKE_DIR/core_load_smoke.exe" native/player/tests/core_smoke/core_load_smoke.c
          # Harness control first: test_core.dll (known-good synthetic core)
          # must pass, so a smoke-harness regression fails here BEFORE the
          # candidates are judged.
          "$SMOKE_DIR/core_load_smoke.exe" "$STAGE/cores/test_core.dll" 25
          # Every candidate core: 50 repeated load/api/init/deinit cycles.
          "$SMOKE_DIR/core_load_smoke.exe" "$STAGE/cores-candidate/gambatte_core.dll" 50
          "$SMOKE_DIR/core_load_smoke.exe" "$STAGE/cores-candidate/fceumm_core.dll" 50
          "$SMOKE_DIR/core_load_smoke.exe" "$STAGE/cores-candidate/prosystem_core.dll" 50
          "$SMOKE_DIR/core_load_smoke.exe" "$STAGE/cores-candidate/mednafen_wswan_core.dll" 50
          "$SMOKE_DIR/core_load_smoke.exe" "$STAGE/cores-candidate/beetle_pce_fast_core.dll" 50
          "$SMOKE_DIR/core_load_smoke.exe" "$STAGE/cores-candidate/genesis_plus_gx_core.dll" 50
          "$SMOKE_DIR/core_load_smoke.exe" "$STAGE/cores-candidate/mgba_core.dll" 50
          "$SMOKE_DIR/core_load_smoke.exe" "$STAGE/cores-candidate/snes9x_core.dll" 50
          "$SMOKE_DIR/core_load_smoke.exe" "$STAGE/cores-candidate/stella_core.dll" 50
          echo "✓ repeated native load/retro_api_version/retro_init/retro_deinit smoke passed (test_core control + nine candidates, no ROM content)"

      - name: Upload unsigned player artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rommulus-player-windows-x86_64-software-only
          path: dist/player-win64-software-only
          if-no-files-found: error
          compression-level: 0

      - name: Generate MinGW import libraries from pinned ANGLE DLL exports
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p deps/angle/lib-mingw
          for dll in libEGL libGLESv2; do
            def="deps/angle/lib-mingw/${dll}.def"
            {
              echo EXPORTS
              objdump -p "deps/angle/${dll}.dll" \
                | sed -n '/\[Ordinal\/Name Pointer\] Table/,/^$/p' \
                | awk '$NF ~ /^[A-Za-z_][A-Za-z0-9_@?]*$/ {print $NF}'
            } > "$def"
            dlltool \
              --input-def "$def" \
              --dllname "${dll}.dll" \
              --output-lib "deps/angle/lib-mingw/${dll}.dll.a" \
              --machine i386:x86-64
          done
          grep -qx 'glGetString' deps/angle/lib-mingw/libGLESv2.def \
            || { echo "::error::generated GLES import definition lacks glGetString"; exit 1; }
          grep -qx 'eglGetDisplay' deps/angle/lib-mingw/libEGL.def \
            || { echo "::error::generated EGL import definition lacks eglGetDisplay"; exit 1; }
          echo "✓ MinGW import libraries generated from the verified DLL export tables"

      - name: Configure and build ANGLE hardware-context player
        working-directory: native/player
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf ../../build/player-windows-x86_64
          ANGLE_ROOT="$(cygpath -u "$GITHUB_WORKSPACE")/deps/angle"
          cmake --preset windows-x86_64 \
            -DSDL3_ROOT="$SDL_PREFIX" \
            -DROMM_ANGLE_EGL_LIBRARY="$ANGLE_ROOT/lib-mingw/libEGL.dll.a" \
            -DROMM_ANGLE_GLESV2_LIBRARY="$ANGLE_ROOT/lib-mingw/libGLESv2.dll.a" \
            -DROMM_ANGLE_INCLUDE_DIR="$ANGLE_ROOT/include"
          cmake --build --preset windows-x86_64 \
            --target rommulus_player angle_gles3_smoke \
            -j"$(nproc)"

      - name: Stage and audit ANGLE graphics-spike closure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          BUILD_DIR="build/player-windows-x86_64"
          STAGE="dist/angle-gles3-spike"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/bin" "$STAGE/licenses"
          cp "$BUILD_DIR/bin/rommulus-player.exe" "$STAGE/bin/"
          cp "$BUILD_DIR/bin/angle_gles3_smoke.exe" "$STAGE/bin/"
          cp "$SDL_PREFIX/bin/SDL3.dll" "$STAGE/bin/"
          cp deps/angle/libEGL.dll deps/angle/libGLESv2.dll "$STAGE/bin/"
          cp deps/angle/LICENSE "$STAGE/licenses/ANGLE-LICENSE.txt"

          imports_of() {
            objdump -p "$1" | grep 'DLL Name:' | sed 's/.*DLL Name: *//' | tr -d '\r'
          }
          UCRT64_BIN="$(dirname "$(command -v x86_64-w64-mingw32-gcc)")"
          initial_imports="$(
            for image in "$STAGE"/bin/*.exe "$STAGE"/bin/*.dll; do
              imports_of "$image"
            done
          )"
          if grep -qi '^libwinpthread-1\.dll$' <<< "$initial_imports"; then
            cp "$UCRT64_BIN/libwinpthread-1.dll" "$STAGE/bin/"
          fi

          is_system_dll() {
            case "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" in
              kernel32.dll|ntdll.dll|kernelbase.dll|user32.dll|gdi32.dll|gdiplus.dll \
              |advapi32.dll|shell32.dll|ole32.dll|oleaut32.dll|psapi.dll \
              |setupapi.dll|version.dll|winmm.dll|imm32.dll|ucrtbase.dll \
              |bcrypt.dll|cfgmgr32.dll|avrt.dll|shcore.dll|dwmapi.dll \
              |dxgi.dll|d3d11.dll|d3d12.dll|d3dcompiler_47.dll \
              |dinput8.dll) return 0 ;;
              api-ms-win-*) return 0 ;;
              *) return 1 ;;
            esac
          }
          staged_copy_of() {
            local want="$1" f
            for f in "$STAGE"/bin/*; do
              [ -f "$f" ] || continue
              if [ "$(basename "$f" | tr '[:upper:]' '[:lower:]')" = "$want" ]; then
                printf '%s\n' "$f"
                return 0
              fi
            done
            return 1
          }

          AUDIT="$STAGE/graphics-spike.txt"
          {
            echo "ANGLE revision: ${ANGLE_REVISION}"
            echo "ANGLE archive SHA-256: ${ANGLE_ARCHIVE_SHA256}"
            echo "ANGLE distribution: XCSoar/angle-libs release a96fca8"
            echo "scope: SDL3/EGL/GLES frontend only; no Tier 2/3 core built or advertised"
          } > "$AUDIT"
          queue="rommulus-player.exe angle_gles3_smoke.exe SDL3.dll libEGL.dll libGLESv2.dll"
          seen=" "
          while [ -n "$queue" ]; do
            name="${queue%% *}"
            case "$queue" in
              *" "*) queue="${queue#* }" ;;
              *) queue="" ;;
            esac
            case "$seen" in *" $name "*) continue ;; esac
            seen="$seen$name "
            path="$STAGE/bin/$name"
            [ -f "$path" ] \
              || { echo "::error::graphics closure member $name is missing"; exit 1; }
            objdump -f "$path" | grep -Eq 'file format (pei|pe)-x86-64' \
              || { echo "::error::$path is not PE32+ x86-64"; exit 1; }
            echo "=== $name imports ===" >> "$AUDIT"
            imports="$(imports_of "$path")"
            printf '%s\n' "$imports" >> "$AUDIT"
            for dll in $imports; do
              low="$(printf '%s' "$dll" | tr '[:upper:]' '[:lower:]')"
              case "$low" in
                libgcc*|libstdc++*|msys-2.0.dll)
                  echo "::error::$path imports forbidden runtime $dll"
                  exit 1
                  ;;
              esac
              if ! is_system_dll "$low"; then
                staged="$(staged_copy_of "$low" || true)"
                [ -n "$staged" ] \
                  || { echo "::error::$path imports unstaged DLL $dll"; exit 1; }
                case "$seen" in
                  *" $(basename "$staged") "*) : ;;
                  *) queue="$queue $(basename "$staged")" ;;
                esac
              fi
            done
          done
          imports_of "$STAGE/bin/rommulus-player.exe" | grep -qi '^libGLESv2\.dll$' \
            || { echo "::error::hardware player does not import the pinned GLES runtime"; exit 1; }
          imports_of "$STAGE/bin/angle_gles3_smoke.exe" | grep -qi '^libGLESv2\.dll$' \
            || { echo "::error::ANGLE smoke does not import the pinned GLES runtime"; exit 1; }
          {
            echo "=== SHA-256 ==="
            ( cd "$STAGE" && find . -type f ! -name graphics-spike.txt \
                | LC_ALL=C sort | xargs sha256sum )
          } >> "$AUDIT"
          cat "$AUDIT"
          echo "✓ ANGLE graphics-spike PE/import closure is complete"

      - name: Run ANGLE GLES 3.0 graphics spike under sanitized PATH
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist/angle-gles3-spike"
          $bin = Join-Path $stage "bin"
          $env:PATH = "$bin;$env:SystemRoot\System32"
          $output = & (Join-Path $bin "angle_gles3_smoke.exe") 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath (Join-Path $stage "angle-runtime.txt")
          if ($exitCode -ne 0) {
            throw "ANGLE GLES3 smoke failed (exit $exitCode)"
          }
          if (-not ($output -match "ANGLE_GLES3_SMOKE_PASS")) {
            throw "ANGLE GLES3 smoke did not emit its PASS marker"
          }

      - name: Upload ANGLE graphics-spike evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rommulus-angle-gles3-spike
          path: dist/angle-gles3-spike
          if-no-files-found: error
          compression-level: 0

  # =================================================================
  # 5. player-win64-e2e  — Phase 3b (synthetic-core E2E on the staged
  #    unsigned artifact)
  # =================================================================
  # Consumes job 4's UNSIGNED artifact via pinned download-artifact, verifies
  # every staged file against import-audit.txt's SHA256 section, and runs the
  # committed host-portable harness (native/player/tests/e2e/player_e2e.py —
  # Python 3 stdlib only) against rommulus-player.exe + test_core.dll under a
  # sanitized PATH (PowerShell: staged bin + System32 only — never
  # /ucrt64/bin or build tools). The harness builds its own fixture tree with
  # SPACE + NON-ASCII directory names ("тест état"), emits strict protocol-v2
  # request JSON, sets the ROMM_PLAYER_*_ROOT contract + allowed revision
  # "test_core=1", and drives headless SDL (SDL_VIDEODRIVER=offscreen — a real
  # window framebuffer for the software renderer — + SDL_RENDER_DRIVER=software
  # + SDL_AUDIODRIVER=dummy; no GPU, no desktop session on windows-2022).
  # Scenarios (all bounded by per-launch timeouts; cleanup targets exact PIDs
  # via TerminateProcess/ctypes, never broad taskkill):
  #   1. valid no-content launch → test_core's own core-requested shutdown
  #      (its CI-only ROMM_TEST_CORE_MAX_FRAMES hook — compiled only into the
  #      player's test_core build — requests RETRO_ENVIRONMENT_SHUTDOWN after
  #      exactly N frames with zero input); asserts result schema/session/
  #      exitKind=core_requested_shutdown/exact frame count/checkpoint +
  #      save size + SHA256 (test_core's 64-byte SRAM is fully deterministic,
  #      so the expected hash is computed in the harness and checked against
  #      BOTH the player-reported value and the file on disk);
  #   2. repeated launch with save restore (candidate moved to savePath like
  #      the desktop supervisor; the restored SRAM byte must carry over — a
  #      fresh core would hash differently, proving the restore);
  #   3. concurrent same-session lock rejection (challenger exits 1 with
  #      launch_failed + "session already active" while the holder runs);
  #   4. force-kill the holder's exact PID → kernel releases the byte-range
  #      lock → immediate relaunch of the SAME session succeeds;
  #   5. negative validation: coreBuildRevision mismatch and corePath outside
  #      the trusted core root (both launch_failed with the exact error text);
  #   6. no orphan PID survives and the whole state tree (including the
  #      deliberately-kept .lock files) deletes cleanly.
  #   7. CANDIDATE Gambatte qualification (cores-candidate/gambatte_core.dll,
  #      passed via --candidate-core; NOT advertised in any manifest): the
  #      harness generates the original deterministic 32 KiB ROM in-process
  #      (gambatte_rom.py — no Nintendo logo, no third-party bytes) into the
  #      trusted CACHE root and launches it under the pinned revision
  #      96174369b3c30d9fc57c926fa3379c273dc6a9a5 (MBC1+RAM+battery, 8 KiB
  #      battery SRAM = 8192 bytes as Gambatte exposes it). Each run is
  #      bounded by the player's qualification ROMM_PLAYER_MAX_FRAMES hook
  #      (compiled in by job 4) and asserts: real frames (bounded
  #      [limit, limit+2]), result schema, exitKind=completed (player-
  #      initiated, checkpoint before stop), 8192-byte SRAM, and the ROM's
  #      deterministic marker/counter invariants against the reported frame
  #      count — plus candidate adoption with counter persistence across
  #      relaunch, repeated load, and force-kill → lock release → relaunch.
  #   8. CANDIDATE FCEUmm qualification (cores-candidate/fceumm_core.dll,
  #      passed via --fceumm-core; NOT advertised in any manifest): the
  #      harness generates the original deterministic 49168-byte iNES ROM in-
  #      process (fceumm_rom.py — mapper 0 NROM + battery bit → FCEUmm's
  #      8192-byte WRAM as SAVE_RAM; no trainer, no third-party bytes) into
  #      the trusted CACHE root and launches it under the pinned revision
  #      b5e3566515c27dc66c9c20572171673126532e06. Each run is bounded by the
  #      same ROMM_PLAYER_MAX_FRAMES hook and asserts: real frames (bounded
  #      [limit, limit+2]), result schema, exitKind=completed, 8192-byte
  #      SRAM, and the ROM's deterministic marker/counter invariants against
  #      the per-run reported frame counts (each power-on contributes its own
  #      two ppudead frames with no VBlank edge) — plus candidate adoption
  #      with counter persistence across relaunch, repeated load, and force-
   #      kill → lock release → relaunch.
   #   9. CANDIDATE ProSystem qualification (cores-candidate/prosystem_core.dll,
   #      passed via --prosystem-core; NOT advertised in any manifest): the
   #      harness generates the original deterministic 16 KiB raw .a78 ROM in-
   #      process (prosystem_rom.py — no "ATARI7800" header, no CC2 marker, no
   #      third-party bytes) into the trusted CACHE root and launches it under
   #      the pinned revision 363b6dfbd3e240762e022c2b4897b4fe55722be3. This
   #      pin exposes NO save RAM (retro_get_memory_size(RETRO_MEMORY_SAVE_RAM)
   #      == 0), so each run — bounded by the same ROMM_PLAYER_MAX_FRAMES hook —
   #      asserts the rigorous no-persistent-save gate: real frames (bounded
   #      [limit, limit+2]), result schema, exitKind=completed,
   #      checkpointWritten false, saveSize/saveHash null, and zero .srm
   #      artifacts for the session (no adoption chain exists) — across valid
   #      launch, repeated load, and force-kill → lock release → relaunch.
   #   10. CANDIDATE Stella qualification (cores-candidate/stella_core.dll,
   #       passed via --stella-core; NOT advertised): the harness generates an
   #       original 4 KiB BIOS-free Atari 2600 image (stella_rom.py), proves
   #       bounded completed frames across valid/repeated/force-kill recovery,
   #       and requires checkpointWritten=false, null save fields, and no
   #       candidate or session .srm artifacts. Stella 7.0 exposes SYSTEM_RAM
   #       only; this intentionally does not fake an SRAM lifecycle.
   #   10. CANDIDATE mednafen_wswan qualification (cores-candidate/
   #       mednafen_wswan_core.dll, passed via --wswan-core; NOT advertised in
   #       any manifest): the harness generates the original deterministic
   #       512 KiB raw .ws image in-process (wswan_rom.py — no WonderWitch
   #       ELISA firmware signature, no Detective Conan header, no third-
   #       party bytes; RomMulus-authored NEC V30 bytecode that counts into
   #       the cart's 8192-byte battery SRAM) into the trusted CACHE root and
   #       launches it under the pinned revision
   #       4b01295838ea89e3f1355bbe4cb5cf98aa6108cd. Each run is bounded by
   #       the same ROMM_PLAYER_MAX_FRAMES hook and asserts: real frames
   #       (bounded [limit, limit+2]), result schema, exitKind=completed,
   #       8192-byte SRAM, and the exact deterministic counter oracle —
   #       SRAM[0x100] = total-increments mod 256 with SRAM[0] = total-1 mod
   #       256 (every run ends mid-iteration after its final unmirrored
   #       increment; per power-on of F frames the core executes exactly
   #       3392*F - 299 increments) — against the player-REPORTED per-run
   #       frame counts, plus candidate adoption with counter persistence
   #       across relaunch (restored SRAM keeps counting), repeated load, and
   #       force-kill → lock release → relaunch.
   # The e2e-out directory (machine-readable report JSON + per-launch logs +
  # result copies) uploads ALWAYS so a green run is auditable and a red one
  # ships its evidence.
  player-win64-e2e:
    name: Player Win64 E2E (synthetic core)
    runs-on: windows-2022
    timeout-minutes: 30
    needs: native-player-win64

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download unsigned player artifact (pinned action)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rommulus-player-windows-x86_64-software-only
          path: dist/player-win64-software-only

      - name: Verify artifact SHA256 manifest (import-audit.txt)
        # Pre-flight integrity gate: every staged file must match the hash
        # recorded by job 4's recursive PE/import audit, so a corrupted or
        # partial download can never reach the E2E scenarios.
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python native/player/tests/e2e/player_e2e.py --verify-artifact dist/player-win64-software-only
          if ($LASTEXITCODE -ne 0) { throw "artifact verification failed (exit $LASTEXITCODE)" }

      - name: Run synthetic-core E2E harness (sanitized PATH, headless SDL)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $stageBin = Join-Path $env:GITHUB_WORKSPACE "dist/player-win64-software-only/bin"
          $python = (Get-Command python).Source
          $env:PYTHONUTF8 = "1"
          # Sanitized loader PATH: ONLY the staged artifact bin + the Windows
          # system directories — never /ucrt64/bin or build tools (same
          # discipline as job 4's smoke step). The harness spawns the player
          # with Python subprocess APIs, bounds every launch, and cleans up
          # exact PIDs only.
          $env:PATH = "$stageBin;$env:SystemRoot\System32;$env:SystemRoot"
          Write-Host "sanitized loader PATH: $env:PATH"
          # Candidate options pass every candidate core explicitly.
          # Candidate cores use cores-candidate/ — never an enabled-core path:
          # the harness stages each into its trusted core root, generates the
          # original deterministic ROMs (32 KiB Game Boy image; 49168-byte
          # iNES mapper-0 NROM + battery; 16 KiB raw .a78; 512 KiB raw .ws)
          # into the trusted cache root, and runs every candidate core's
          # qualification scenarios (bounded presented-frame runs under the
          # ROMM_PLAYER_MAX_FRAMES hook compiled in by job 4; Gambatte/FCEUmm/
          # mednafen_wswan: 8192-byte battery SRAM + deterministic counter
          # invariants + candidate adoption/relaunch persistence; ProSystem:
          # no save RAM at all → rigorous no-persistent-save gate with zero
          # .srm artifacts) plus repeated load and force-kill lock recovery,
          # alongside every test_core scenario.
          & $python native/player/tests/e2e/player_e2e.py `
            --stage dist/player-win64-software-only `
            --workdir e2e-out `
            --candidate-core (Join-Path $env:GITHUB_WORKSPACE "dist/player-win64-software-only/cores-candidate/gambatte_core.dll") `
            --fceumm-core (Join-Path $env:GITHUB_WORKSPACE "dist/player-win64-software-only/cores-candidate/fceumm_core.dll") `
            --prosystem-core (Join-Path $env:GITHUB_WORKSPACE "dist/player-win64-software-only/cores-candidate/prosystem_core.dll") `
            --stella-core (Join-Path $env:GITHUB_WORKSPACE "dist/player-win64-software-only/cores-candidate/stella_core.dll") `
            --wswan-core (Join-Path $env:GITHUB_WORKSPACE "dist/player-win64-software-only/cores-candidate/mednafen_wswan_core.dll") `
            --pce-core (Join-Path $env:GITHUB_WORKSPACE "dist/player-win64-software-only/cores-candidate/beetle_pce_fast_core.dll") `
            --genesis-plus-gx-core (Join-Path $env:GITHUB_WORKSPACE "dist/player-win64-software-only/cores-candidate/genesis_plus_gx_core.dll") `
            --mgba-core (Join-Path $env:GITHUB_WORKSPACE "dist/player-win64-software-only/cores-candidate/mgba_core.dll") `
            --snes9x-core (Join-Path $env:GITHUB_WORKSPACE "dist/player-win64-software-only/cores-candidate/snes9x_core.dll")
          if ($LASTEXITCODE -ne 0) { throw "player E2E harness failed (exit $LASTEXITCODE)" }

      - name: Upload E2E results and logs (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rommulus-player-win64-e2e-results
          path: e2e-out
          if-no-files-found: ignore
