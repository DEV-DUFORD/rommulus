# Linux x86_64 Desktop CI — RomMulus
# -------------------------------------------------------------------
# Plan:   plans/LINUX_X64.md  §15 (Build and CI plan)
# Runner: ubuntu-24.04
# JDK:    Temurin 17 (pinned via actions/setup-java@v4)
#
# Toolchain packages (installed UNPINNED — exact apt pins go stale when
# noble ships -ubuntuN rebuilds, e.g. clang-18 1:18.1.3-1 was superseded
# by 1:18.1.3-1ubuntu1 and broke dependency resolution):
#   clang-18, cmake, ninja-build, libsqlite3-dev, xvfb, pkg-config, zstd
#   libsdl3-dev — NOT in noble repos; requires PPA or source build.
#
# STATUS (Phase 14, sub-unit 2):
#   Jobs 5-6 (native-debug-asan-ubsan, native-release-build) and job 7
#   (player-build) are enabled.  Jobs 9-10 (package-tarball,
#   license-and-provenance-audit) were un-stubbed in Phase 14 sub-unit 2:
#   package-tarball builds player + cores + app jar + jlink runtime, assembles
#   the §16.1 tarball via packaging/build-tarball.sh, uploads it, and
#   smoke-tests the launcher fail-fast; the audit job runs the executable §15
#   assertions against the source tree and the packaged artifact.  Job 8
#   (core-smoke-tier-1) remains stubbed with `if: false` until Linux core
#   smoke coverage lands (Phase 8+).
#
# REQUIRED CI ASSERTIONS (from §15):
#   • no Android imports in shared modules
#   • no JNI/Android/SDL imports in native engine
#   • launch schema compatibility fixtures pass
#   • core SHA and provenance match
#   • exported symbols match allowlist
#   • package has every required license
#   • package has no undeclared executable
#   • no file is world-writable
#   • generated artifacts contain no test credentials or tokens
#   • player has no direct dependency on JVM/Android libraries
#   • desktop bundle starts with bundled runtime
# -------------------------------------------------------------------

name: Linux x64 CI

on:
  push:
    branches: [main, zd/linux-build]
  pull_request:
    branches: [main, zd/linux-build]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version (for example, 1.2.3)
        required: false
        default: 0.1.0-dev
        type: string

permissions:
  contents: read

concurrency:
  group: linux-x64-${{ github.ref }}
  cancel-in-progress: true

# -------------------------------------------------------------------
# Native toolchain (Ubuntu 24.04 noble) — installed unpinned per job
# -------------------------------------------------------------------
env:
  # NOTE: do NOT set org.gradle.jvmargs here — a system property from
  # GRADLE_OPTS overrides gradle.properties and would drop the AGP-required
  # --add-opens flags (JDK 17 strong encapsulation / Gson reflection).
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # =================================================================
  # 1. shared-jvm-tests  — Phase 0+ (functional when shared modules exist)
  # =================================================================
  shared-jvm-tests:
    name: Shared JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run shared module JVM tests
        run: |
          ./gradlew --configure-on-demand \
            :shared:domain:test \
            :shared:network:test \
            :shared:storage-api:test \
            :shared:presentation:test \
            :shared:ui:test

      # The AndroidImportGuardTest (in :shared:domain:test) already scans
      # all Kotlin files under shared/{domain,network,storage-api,presentation}/src/main/
      # for `import android.`, `import androidx.`, and fully-qualified
      # `android.`/`androidx.` tokens.  No redundant grep is needed here.
      # CI relies on the JUnit guard test to enforce this architecture rule.

  # =================================================================
  # 2. android-regression  — Phase 0 (functional now)
  # =================================================================
  android-regression:
    name: Android regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android build tools
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble Android debug APK
        run: ./gradlew :app:assembleDebug

      - name: Assemble Android release (unsigned)
        run: ./gradlew :app:assembleRelease

  # =================================================================
  # 3. desktop-tests  — Phase 0+ (functional when :desktop exists)
  # =================================================================
  desktop-tests:
    name: Desktop tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install native dev packages
        run: |
          set -euo pipefail
          sudo apt-get update
           sudo apt-get install -y \
             clang-18 \
             cmake \
             ninja-build \
             libsqlite3-dev \
             xvfb \
             pkg-config
          # NOTE: libsdl3-dev is NOT in the noble repos.  It is available
          # only in Ubuntu 26.04+ (resolute) or via third-party PPAs.
          # When Phase 7 lands, add a PPA or source-build step here.

      - name: Verify toolchain versions
        run: |
          set -euo pipefail
          echo "=== Toolchain versions ==="
          clang-18 --version | head -1
          cmake --version | head -1
          ninja --version
          pkg-config --modversion sqlite3
          sqlite3 --version 2>/dev/null || echo "sqlite3 CLI not installed (dev headers present)"
          echo "=========================="

      - name: Run desktop build and tests
        run: |
          # Xvfb for any headless UI tests (§15: Xvfb for ordinary desktop UI tests)
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          XVFB_PID=$!
          ./gradlew --configure-on-demand :desktop:test :desktop:build
          kill $XVFB_PID || true

      - name: Smoke — desktop window starts and stays alive
        run: |
          # timeout exit code 124 means the process was still running when
          # the timer fired — i.e. the Compose Desktop window opened and
          # did not crash immediately.
          set +e
          timeout 30 xvfb-run -a ./gradlew --offline --no-daemon --configure-on-demand :desktop:run
          rc=$?
          set -e
          if [ $rc -eq 124 ]; then
            echo "✓ Desktop window stayed alive for 30s — smoke pass."
            exit 0
          else
            echo "::error::Desktop app exited early (rc=$rc) — smoke fail."
            exit 1
          fi

  # =================================================================
  # 4. secret-service-conformance  — Phase 5 (functional now)
  # =================================================================
  # plans/PHASE5.md §5.4 item 4: the Secret Service conformance scripts
  # (desktop/ci/secret-service/) must be wired into CI before Phase 6
  # enables desktop login.
  secret-service-conformance:
    name: Secret Service conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Secret Service packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            dbus \
            python3-dbus \
            python3-gi \
            gnome-keyring \
            libglib2.0-bin
          # dbus:          dbus-run-session (private session bus for both scripts)
          # python3-dbus:  mock daemon + name-owner probes (import dbus)
          # python3-gi:    dbus.mainloop.glib required by mock_secret_service.py
          # gnome-keyring: real gnome-keyring-daemon for the smoke step
          # glib2.0-bin:   gdbus, used by gnome-keyring-smoke.sh

      - name: Verify Secret Service tooling
        run: |
          set -euo pipefail
          echo "=== Secret Service tooling ==="
          dbus-daemon --version | head -1
          gdbus help >/dev/null
          echo "gdbus OK"
          python3 -c 'import dbus; print("python3-dbus OK")'
          gnome-keyring-daemon --version
          echo "================================"

      - name: Conformance — mock daemon (available + locked)
        run: |
          # Self-invokes ./gradlew from the repo root; runs the conformance
          # test against mock_secret_service.py in available + locked modes.
          set -euo pipefail
          desktop/ci/secret-service/run_conformance.sh

      - name: Smoke — real gnome-keyring-daemon (unlocked + locked)
        run: |
          # Headless-safe: the script runs inside `dbus-run-session` and
          # deliberately never triggers the UI-gated unlock prompt (the
          # backend contract is to fail closed on a locked keyring, so no
          # desktop session or interactive unlock is needed on the runner).
          set -euo pipefail
          desktop/ci/secret-service/gnome-keyring-smoke.sh

  # =================================================================
  # 5. native-debug-asan-ubsan  — Phase 7 (enabled in Wave 9c)
  # =================================================================
  # Compiles the platform-neutral engine unit tests (native/tests, a
  # standalone CMake/CTest project) with clang-18 under AddressSanitizer
  # and UndefinedBehaviorSanitizer, then runs the CTest suite.
  native-debug-asan-ubsan:
    name: Native debug (ASan/UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install native dev packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            cmake \
            ninja-build \
            libsqlite3-dev \
            pkg-config

      - name: Verify toolchain versions
        run: |
          set -euo pipefail
          echo "=== Toolchain versions ==="
          clang-18 --version | head -1
          cmake --version | head -1
          ninja --version
          pkg-config --modversion sqlite3
          echo "=========================="

      - name: Configure engine tests (Debug, ASan+UBSan)
        run: |
          set -euo pipefail
          cmake -S native/tests -B build \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build engine tests
        run: |
          set -euo pipefail
          cmake --build build

      - name: Run engine tests (CTest, ASan/UBSan)
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure

  # =================================================================
  # 6. native-release-build  — Phase 7 (enabled in Wave 9c)
  # =================================================================
  # Builds the platform-neutral engine unit tests (native/tests) as an
  # optimized Release build with clang-18 (no sanitizers), then runs the
  # CTest suite.
  native-release-build:
    name: Native release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install native dev packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            cmake \
            ninja-build \
            libsqlite3-dev \
            pkg-config

      - name: Verify toolchain versions
        run: |
          set -euo pipefail
          echo "=== Toolchain versions ==="
          clang-18 --version | head -1
          cmake --version | head -1
          ninja --version
          pkg-config --modversion sqlite3
          echo "=========================="

      - name: Configure engine tests (Release)
        run: |
          set -euo pipefail
          cmake -S native/tests -B build \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build engine tests
        run: |
          set -euo pipefail
          cmake --build build

      - name: Run engine tests (CTest)
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure

  # =================================================================
  # 7. player-build  — Phase 8 (SDL3 rommulus-player)
  # =================================================================
  # Builds rommulus-player from source with a vendored static SDL3 build
  # (release-3.4.14). SDL3 is not in the noble repos; static linkage keeps
  # the downloadable player from requiring a separately installed SDL3.
  player-build:
    name: Player build (SDL3)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install native dev packages (SDL3 build deps)
        run: |
          set -euo pipefail
          sudo apt-get update
          # Includes SDL3 source-build dependencies and NASM for the N64 x86_64 dynarec.
          sudo apt-get install -y \
            clang-18 \
            cmake \
            ninja-build \
            nasm \
            libsqlite3-dev \
            pkg-config \
            wget \
            build-essential \
            git \
            libasound2-dev \
            libaudio-dev \
            libfribidi-dev \
            libjack-dev \
            libsndio-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxss-dev \
            libxtst-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libthai-dev \
            libusb-1.0-0-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libdecor-0-dev \
            liburing-dev

      - name: Verify toolchain versions
        run: |
          set -euo pipefail
          echo "=== Toolchain versions ==="
          clang-18 --version | head -1
          cmake --version | head -1
          ninja --version
          echo "=========================="

      - name: Build and install SDL3 from source (release-3.4.14)
        run: |
          set -euo pipefail
          SDL_VERSION="3.4.14"
          SDL_TAG="release-${SDL_VERSION}"
          mkdir -p deps/sdl3
          echo "Downloading SDL3 ${SDL_TAG}..."
          wget -qO- "https://github.com/libsdl-org/SDL/releases/download/${SDL_TAG}/SDL3-${SDL_VERSION}.tar.gz" \
            | tar -xz -C deps/sdl3 --strip-components=1
          echo "Configuring SDL3 Release build (prefix=/usr/local)..."
          cmake -S deps/sdl3 -B build/sdl \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON
          cmake --build build/sdl -j"$(nproc)"
          sudo cmake --install build/sdl
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="/usr/local:${CMAKE_PREFIX_PATH:-}"
          echo "SDL3 installed to /usr/local."
          pkg-config --modversion SDL3 2>/dev/null && echo "✓ SDL3 pkg-config OK" || echo "⚠ SDL3 pkg-config not found"

      - name: Configure player (Release)
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="/usr/local:${CMAKE_PREFIX_PATH:-}"
          cmake -S native/player -B build/player \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build player
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="/usr/local:${CMAKE_PREFIX_PATH:-}"
          cmake --build build/player

      - name: Verify rommulus_player binary exists
        run: |
          set -euo pipefail
          PLAYER_BIN="build/player/rommulus_player"
          if [ -x "$PLAYER_BIN" ]; then
            echo "✓ rommulus_player binary found at ${PLAYER_BIN} ($(stat -c%s "$PLAYER_BIN") bytes)"
            file "$PLAYER_BIN"
          else
            echo "::error::rommulus_player binary not found at ${PLAYER_BIN}"
            ls -la build/player/ 2>/dev/null || echo "(build/player/ directory does not exist)"
            exit 1
          fi

  # =================================================================
  # 8. core-smoke-tier-1  — STUBBED (Phase 8+)
  # =================================================================
  # TODO(phase 8+): enable when Linux core builds and rommulus-player exist.
  #   Requires Linux core builds, which are Phase 8+ scope — not Phase 7.
  #   This job will run the per-core smoke gate (§13.2) for Tier 1 cores
  #   (test_core, Gambatte): retro_init/retro_deinit smoke, synthetic
  #   content boot, 10-minute automated frame run, input mapping, and
  #   SRAM round-trip where supported.
  #   Asserts:
  #     • core SHA and provenance match (§15)
  #     • exported symbols match allowlist (§15)
  #     • launch schema compatibility fixtures pass (§15)
  core-smoke-tier-1:
    name: Core smoke (Tier 1)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: false  # TODO(phase 8+): remove this guard when Linux core builds land (Phase 8+, not Phase 7)

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install native dev packages
        run: |
          set -euo pipefail
          sudo apt-get update
           sudo apt-get install -y \
             clang-18 \
             cmake \
             ninja-build \
             libsqlite3-dev
          # libsdl3-dev: not in noble; add PPA when Phase 7 lands.

      - name: Verify toolchain versions
        run: |
          set -euo pipefail
          echo "=== Toolchain versions ==="
          clang-18 --version | head -1
          cmake --version | head -1
          ninja --version
          pkg-config --modversion sqlite3
          echo "=========================="

      - name: Stub — core smoke tests
        run: |
          echo "⏭ core-smoke-tier-1 is stubbed until Linux core builds land (Phase 8+)."

  # =================================================================
  # 9. package-tarball  — Phase 14 (enabled in sub-unit 2)
  # =================================================================
  # Assembles the self-contained x86_64 tarball
  # (rommulus-<version>-linux-x86_64.tar.zst, §16.1) via
  # packaging/build-tarball.sh: Release player + all cores, desktop app jar,
  # jlink JVM runtime, launcher, desktop entry, icons, licenses, core manifest
  # (deterministic tar, zstd -T1).
  #
  # The jlink runtime is built with the command documented in
  # packaging/README.md §"JVM runtime". Verifying that module list against the
  # app's actual runtime needs is a follow-up sub-unit; the image itself is a
  # genuine Temurin 17 jlink output, not a placeholder.
  #
  # Asserts (§15):
  #   • package has every required license (re-asserted in audit job)
  #   • package has no undeclared executable (inventory printed by build-tarball.sh)
  #   • no file is world-writable (build-tarball.sh hard-fails on o+w files)
  #   • generated artifacts contain no test credentials or tokens
  #     (audit job, against this artifact)
  #   • desktop bundle starts with bundled runtime — the smoke step here covers
  #     the launcher fail-fast path (runtime absent -> exit 5); a full headless
  #     start is covered by desktop-tests.
  package-tarball:
    name: Package tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ROMMULUS_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version || '0.1.0-dev' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install native dev packages (SDL3 build deps + nasm + zstd)
        run: |
          set -euo pipefail
          sudo apt-get update
          # Same SDL3 source-build dependency set as player-build, plus nasm
          # (N64 x86_64 dynarec) and zstd (tarball compression).
          sudo apt-get install -y \
            clang-18 \
            cmake \
            ninja-build \
            nasm \
            libsqlite3-dev \
            pkg-config \
            wget \
            build-essential \
            git \
            zstd \
            libasound2-dev \
            libaudio-dev \
            libfribidi-dev \
            libjack-dev \
            libsndio-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxss-dev \
            libxtst-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libthai-dev \
            libusb-1.0-0-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libdecor-0-dev \
            liburing-dev \
            xvfb

      - name: Verify toolchain versions
        run: |
          set -euo pipefail
          echo "=== Toolchain versions ==="
          clang-18 --version | head -1
          cmake --version | head -1
          ninja --version
          nasm --version
          zstd --version
          pkg-config --modversion sqlite3
          echo "=========================="

      - name: Build and install SDL3 from source (release-3.4.14)
        run: |
          set -euo pipefail
          SDL_VERSION="3.4.14"
          SDL_TAG="release-${SDL_VERSION}"
          mkdir -p deps/sdl3
          echo "Downloading SDL3 ${SDL_TAG}..."
          wget -qO- "https://github.com/libsdl-org/SDL/releases/download/${SDL_TAG}/SDL3-${SDL_VERSION}.tar.gz" \
            | tar -xz -C deps/sdl3 --strip-components=1
          echo "Configuring SDL3 Release build (prefix=/usr/local)..."
          cmake -S deps/sdl3 -B build/sdl \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON
          cmake --build build/sdl -j"$(nproc)"
          sudo cmake --install build/sdl
          pkg-config --modversion SDL3 2>/dev/null && echo "✓ SDL3 pkg-config OK" || echo "⚠ SDL3 pkg-config not found"

      - name: Configure and build player + cores (Release)
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="/usr/local:${CMAKE_PREFIX_PATH:-}"
          cmake -S native/player -B build/player \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/player

      - name: Verify player binary and core libraries
        run: |
          set -euo pipefail
          PLAYER_BIN="build/player/rommulus_player"
          if [ ! -x "$PLAYER_BIN" ]; then
            echo "::error::rommulus_player binary not found at ${PLAYER_BIN}"
            ls -la build/player/ 2>/dev/null || echo "(build/player/ directory does not exist)"
            exit 1
          fi
          file "$PLAYER_BIN"
          core_count=$(find build/player -maxdepth 1 -name 'lib*_core.so' | wc -l)
          echo "Core shared libraries in build/player: ${core_count}"
          find build/player -maxdepth 1 -name 'lib*.so' | LC_ALL=C sort
          [ "$core_count" -gt 0 ] \
            || { echo "::error::no core shared libraries (lib*_core.so) found in build/player"; exit 1; }

      - name: Build desktop app jar
        run: |
          set -euo pipefail
          ./gradlew --configure-on-demand :desktop:jar :desktop:copyRuntimeClasspath
          ls -lh desktop/build/libs/desktop.jar
          runtime_jar_count=$(find desktop/build/runtime-libs -maxdepth 1 -name '*.jar' | wc -l)
          [ "$runtime_jar_count" -gt 0 ] \
            || { echo "::error::desktop runtime classpath was not copied"; exit 1; }
          echo "Desktop runtime dependency jars: $runtime_jar_count"

      - name: Build jlink JVM runtime (build/runtime)
        run: |
          set -euo pipefail
          # Documented in packaging/README.md §"JVM runtime".
          #
          # The ENTIRE --add-modules list must stay on ONE line: a backslash
          # line-continuation after the trailing comma collapses to a single
          # space, and jlink fails with "Error: invalid argument".
          #
          # MODULE LIST COMPLETE (verified): includes java.net.http,
          # jdk.crypto.ec, java.naming, and java.management, which the app
          # needs for OkHttp/HTTPS. Verified with a TLS smoke test: a jlink
          # runtime built from this exact module list made a live HTTPS
          # request via java.net.http.HttpClient (TLS handshake OK).
          # REMAINING before ANY release artifact ships: exercise
          # build/runtime with the real app to confirm no
          # ModuleNotFoundException/NoClassDefFoundError. This is a genuine
          # Temurin 17 jlink image, not a placeholder.
          jlink --add-modules java.base,java.datatransfer,java.desktop,java.logging,java.management,java.naming,java.net.http,java.prefs,java.sql,java.xml,jdk.crypto.ec,jdk.unsupported --output build/runtime --strip-debug --no-header-files --no-man-pages
          [ -x build/runtime/bin/java ] \
            || { echo "::error::jlink image missing bin/java"; exit 1; }
          build/runtime/bin/java -version

      - name: Assemble tarball (packaging/build-tarball.sh)
        run: |
          set -euo pipefail
          VERSION="${ROMMULUS_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Package version must resemble X.Y.Z (optionally with a prerelease suffix)."
            exit 1
          fi
          packaging/build-tarball.sh "$VERSION"

      - name: Build AppImage
        run: |
          set -euo pipefail
          VERSION="${ROMMULUS_VERSION#v}"
          TOOL="build/appimagetool-1.9.1-x86_64.AppImage"
          RUNTIME="build/appimage-runtime-20251108-x86_64"
          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            -O "$TOOL"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $TOOL" \
            | sha256sum --check
          chmod +x "$TOOL"
          wget -q \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 \
            -O "$RUNTIME"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $RUNTIME" \
            | sha256sum --check
          APPIMAGETOOL="$PWD/$TOOL" APPIMAGE_RUNTIME="$PWD/$RUNTIME" \
            packaging/build-appimage.sh "$VERSION"

      - name: Verify tarball artifact
        run: |
          set -euo pipefail
          VERSION="${ROMMULUS_VERSION#v}"
          ARTIFACT="dist/rommulus-${VERSION}-linux-x86_64.tar.zst"
          if [ ! -f "$ARTIFACT" ]; then
            echo "::error::artifact missing: $ARTIFACT"
            ls -la dist/ 2>/dev/null || echo "(dist/ does not exist)"
            exit 1
          fi
          size=$(stat -c%s "$ARTIFACT")
          echo "Artifact: $ARTIFACT (${size} bytes)"
          [ "$size" -gt 5242880 ] \
            || { echo "::error::artifact is smaller than 5 MiB — not a real bundle"; exit 1; }
          zstd -t "$ARTIFACT" && echo "✓ zstd integrity OK"
          # Spot-check the required top-level entries (tar stores them as ./...).
          listing="$(tar --zstd -tf "$ARTIFACT")"
          for entry in \
            ./bin/rommulus \
            ./bin/rommulus.sh \
            ./bin/rommulus-player \
            ./lib/runtime/bin/java \
            ./lib/rommulus/app.jar \
            ./share/rommulus/PACKAGE.sha256; do
            printf '%s\n' "$listing" | grep -qx "$entry" \
              || { echo "::error::required entry missing from tarball: $entry"; exit 1; }
          done
          printf '%s\n' "$listing" \
            | grep -Eq '^\./lib/rommulus/lib/kotlin-stdlib-[^/]+\.jar$' \
            || { echo "::error::Kotlin runtime is missing from tarball"; exit 1; }
          echo "✓ required entries present in tarball"

      - name: Verify AppImage artifact
        run: |
          set -euo pipefail
          VERSION="${ROMMULUS_VERSION#v}"
          APPIMAGE="dist/rommulus-${VERSION}-linux-x86_64.AppImage"
          [ -x "$APPIMAGE" ] \
            || { echo "::error::executable AppImage missing: $APPIMAGE"; exit 1; }
          size=$(stat -c%s "$APPIMAGE")
          [ "$size" -gt 5242880 ] \
            || { echo "::error::AppImage is smaller than 5 MiB"; exit 1; }
          extract="$(mktemp -d)"
          trap 'rm -rf "$extract"' EXIT
          (
            cd "$extract"
            "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract >/dev/null
          )
          [ -L "$extract/squashfs-root/AppRun" ]
          [ -x "$extract/squashfs-root/bin/rommulus-player" ]
          [ -x "$extract/squashfs-root/lib/runtime/bin/java" ]
          [ -f "$extract/squashfs-root/lib/rommulus/app.jar" ]
          find "$extract/squashfs-root/lib/rommulus/lib" -name 'kotlin-stdlib-*.jar' \
            | grep -q .
          echo "✓ AppImage contains AppRun and the complete application bundle"

      - name: Smoke — AppImage starts and stays alive
        run: |
          set +e
          VERSION="${ROMMULUS_VERSION#v}"
          timeout 30 xvfb-run -a "dist/rommulus-${VERSION}-linux-x86_64.AppImage"
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then
            echo "::error::AppImage exited before its desktop window smoke timeout (rc=$rc)"
            exit 1
          fi
          echo "✓ AppImage desktop process stayed alive for 30 seconds"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rommulus-linux-x86_64-tarball
          path: |
            dist/*.tar.zst
            dist/*.AppImage
          if-no-files-found: error
          compression-level: 0

      - name: Smoke — launcher fails fast without the bundled runtime (exit 5)
        run: |
          set -uo pipefail
          SMOKE="$(mktemp -d)"
          trap 'rm -rf "$SMOKE"' EXIT
          VERSION="${ROMMULUS_VERSION#v}"
          tar --zstd -xf "dist/rommulus-${VERSION}-linux-x86_64.tar.zst" -C "$SMOKE"
          # Sanity: the shipped bundle contains the jlink runtime...
          if [ ! -x "$SMOKE/lib/runtime/bin/java" ]; then
            echo "::error::bundled runtime (lib/runtime/bin/java) missing from tarball"
            exit 1
          fi
          # ...then simulate an incomplete install (runtime stripped) with no
          # fallback JVM available: the launcher must fail fast with exit 5 and
          # a clear message (launcher contract, §15).
          rm -rf "$SMOKE/lib/runtime"
          # GitHub's Ubuntu image now exposes Java from /usr/bin, so construct
          # a command allowlist containing only what the launcher needs before
          # JVM discovery. This proves the no-Java path independently of the
          # runner image.
          SMOKE_PATH="$SMOKE/path"
          mkdir -p "$SMOKE_PATH"
          for command_name in env bash readlink dirname awk sha256sum cut; do
            ln -s "$(command -v "$command_name")" "$SMOKE_PATH/$command_name"
          done
          if err="$(env -u JAVA_HOME PATH="$SMOKE_PATH" "$SMOKE/bin/rommulus" 2>&1 >/dev/null)"; then
            rc=0
          else
            rc=$?
          fi
          echo "launcher exit code: ${rc}"
          printf '%s\n' "$err"
          if [ "$rc" -ne 5 ]; then
            echo "::error::expected launcher exit 5 (no usable JVM), got ${rc}"
            exit 1
          fi
          if ! printf '%s\n' "$err" | grep -q "no usable JVM"; then
            echo "::error::launcher error message missing 'no usable JVM'"
            exit 1
          fi
          echo "✓ Launcher fail-fast OK: exit 5 with a clear message when the runtime is absent."

  # =================================================================
  # 10. license-and-provenance-audit  — Phase 14 (enabled in sub-unit 2)
  # =================================================================
  # Runs the §15 assertions that are executable in CI, against both the source
  # tree and the packaged tarball produced by package-tarball:
  #   • no Android imports in shared modules (source grep; the JUnit guard test
  #     in :shared:domain additionally covers fully-qualified usages)
  #   • no JNI/Android/SDL references in native engine (source grep)
  #   • package has every required license (extracted bundle)
  #   • package has no undeclared executable (exact +x set in extracted bundle)
  #   • no file is world-writable (packaging/ tree + extracted bundle)
  #   • generated artifacts contain no test credentials or tokens (packaging/ + extracted bundle)
  #   • core provenance: every manifested core ships as a .so (extracted bundle)
  #   • player has no direct dependency on JVM/Android libraries (ldd)
  # Documented follow-ups (not asserted here):
  #   • core SHA and provenance match — binaryChecksums."linux-x86_64" is still null
  #   • exported symbols match allowlist — no symbol-allowlist artifact exists yet
  #   • desktop bundle starts with bundled runtime — needs a display; see desktop-tests
  license-and-provenance-audit:
    name: License and provenance audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: package-tarball

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No JDK / native toolchain needed here: the assertions run against the
      # source tree and the tarball artifact produced by package-tarball.

      - name: Download tarball artifact (from package-tarball)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rommulus-linux-x86_64-tarball
          path: dist

      - name: Install audit runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 zstd

      - name: Extract tarball for inspection
        run: |
          set -euo pipefail
          mkdir -p audit/extract
          artifact="$(find dist -maxdepth 1 -name 'rommulus-*-linux-x86_64.tar.zst' -print -quit)"
          [ -n "$artifact" ] || { echo "::error::Linux tarball was not downloaded"; exit 1; }
          tar --zstd -xf "$artifact" -C audit/extract

      - name: Assert — no Android imports in shared modules
        run: |
          set -euo pipefail
          hits="$(grep -rnE 'import (android|androidx)\.' \
            shared/domain/src/main \
            shared/network/src/main \
            shared/storage-api/src/main \
            shared/presentation/src/main || true)"
          if [ -n "$hits" ]; then
            echo "::error::Android imports found in shared module main sources:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "✓ no android./androidx. imports in shared/{domain,network,storage-api,presentation}/src/main"

      - name: Assert — no JNI/Android/SDL references in native engine
        run: |
          set -euo pipefail
          hits="$(grep -rnE 'jni\.h|android/|oboe|SDL' native/engine || true)"
          if [ -n "$hits" ]; then
            echo "::error::JNI/Android/SDL references found in native/engine:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "✓ native/engine has no JNI, Android, Oboe, or SDL references"

      - name: Assert — package has every required license
        run: |
          set -euo pipefail
          for f in libretro.txt NOTICE third_party_license_metadata third_party_licenses; do
            p="audit/extract/share/licenses/rommulus/$f"
            if [ ! -s "$p" ]; then
              echo "::error::required license missing or empty in package: $p"
              exit 1
            fi
          done
          echo "✓ all required licenses present and non-empty (share/licenses/rommulus/)"

      - name: Assert — package has no undeclared executable
        run: |
          set -euo pipefail
          # The only regular files that may carry +x inside the bundle are the
          # launcher, the player, and the jlink runtime's own executables: a
          # real Temurin 17 jlink image ships bin/java plus bin/keytool,
          # lib/jexec, and lib/jspawnhelper as +x regular files
          # OpenJDK 17 jlink output). (bin/rommulus_player is a symlink, not a
          # regular file; *.so shared libraries legitimately carry the exec bit
          # and are excluded.)
          actual="$(find audit/extract -type f -perm -u+x ! -name '*.so' | sed 's|^audit/extract/||' | LC_ALL=C sort)"
          expected="$(printf '%s\n' bin/rommulus bin/rommulus-player lib/runtime/bin/java lib/runtime/bin/keytool lib/runtime/lib/jexec lib/runtime/lib/jspawnhelper | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::executable inventory differs from the declared set:"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          echo "✓ executable inventory matches the declared set exactly"

      - name: Assert — no world-writable files (packaging tree + package)
        run: |
          set -euo pipefail
          # Symlink modes are ignored on Linux and conventionally appear as
          # 0777; enforce the policy on regular files.
          ww="$(find packaging audit/extract -type f -perm -o+w)"
          if [ -n "$ww" ]; then
            echo "::error::world-writable files found:"
            printf '%s\n' "$ww"
            exit 1
          fi
          echo "✓ no world-writable files in packaging/ or the extracted package"

      - name: Assert — no test credentials or tokens in artifacts
        run: |
          set -euo pipefail
          # Scan the source packaging tree and the extracted bundle for
          # credential-like strings. Excluded (legitimate, non-generated content):
          #   • share/licenses/**  — third-party license text
          #   • README.md          — documentation prose
          #   • lib/runtime/**     — upstream Temurin JDK 17 jlink image (integrity
          #                         covered by PACKAGE.sha256 + jlink provenance)
          #   • shell comment lines and binary files (grep -I skips binaries)
          scan() {
            grep -rniIE 'password|token|secret|BEGIN [A-Z ]*PRIVATE KEY' "$1" 2>/dev/null \
              | grep -vE '/share/licenses/' \
              | grep -vE '/docs/' \
              | grep -vE '(^|/)README\.md:' \
              | grep -vE '/lib/runtime/' \
              | grep -vE ':[0-9]+:[[:space:]]*#' \
              || true
          }
          hits="$( { scan packaging; scan audit/extract; } )"
          if [ -n "$hits" ]; then
            echo "::error::credential-like strings found in generated artifacts:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "✓ no test credentials or tokens in packaging/ or the package"

      - name: Assert — core provenance (every manifested core ships)
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, pathlib, sys
          manifest = json.load(open("packaging/share/rommulus/core-manifest.json"))
          cores_dir = pathlib.Path("audit/extract/lib/rommulus/cores")
          missing = [
              f'{core["coreId"]} -> {core["coreLibraryFile"]}'
              for core in manifest["cores"]
              if not (cores_dir / core["coreLibraryFile"]).is_file()
          ]
          if missing:
              print("::error::manifested cores missing from package lib/rommulus/cores/:")
              print("\n".join(missing))
              sys.exit(1)
          print(f"✓ all {len(manifest['cores'])} manifested cores present in the package")
          # Follow-up: full "core SHA and provenance match" lands when
          # binaryChecksums."linux-x86_64" is pinned (currently null).
          PYEOF

      - name: Assert — player has no direct JVM/Android dependency
        run: |
          set -euo pipefail
          ldd audit/extract/bin/rommulus-player > /tmp/player-ldd.txt
          [ -s /tmp/player-ldd.txt ] || { echo "::error::ldd produced no output"; exit 1; }
          cat /tmp/player-ldd.txt
          if grep -q 'not found' /tmp/player-ldd.txt; then
            echo "::error::rommulus-player has unresolved runtime dependencies"
            exit 1
          fi
          if grep -iE 'libjvm|libjava|android' /tmp/player-ldd.txt; then
            echo "::error::rommulus-player links against JVM/Android libraries"
            exit 1
          fi
          echo "✓ rommulus-player has no unresolved or direct JVM/Android library dependency"

          ldd audit/extract/lib/rommulus/cores/libmupen64plus_next_core.so \
            > /tmp/n64-core-ldd.txt
          cat /tmp/n64-core-ldd.txt
          if grep -q 'not found' /tmp/n64-core-ldd.txt; then
            echo "::error::N64 core has unresolved runtime dependencies"
            exit 1
          fi
          echo "✓ N64 core has no unresolved runtime dependencies"

      - name: Note — §15 assertions deferred to follow-up sub-units
        run: |
          set -euo pipefail
          echo "Deferred §15 assertions (documented, not yet executable in CI):"
          echo "  • core SHA and provenance match — pin binaryChecksums.\"linux-x86_64\" into core-manifest.json"
          echo "  • exported symbols match allowlist — no symbol-allowlist artifact exists yet"
          echo "  • desktop bundle starts with bundled runtime — needs a display; covered by desktop-tests"

  publish-linux-release:
    name: Publish Linux release package
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    needs: [package-tarball, license-and-provenance-audit]
    permissions:
      contents: write

    steps:
      - name: Download validated tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rommulus-linux-x86_64-tarball
          path: dist

      - name: Attach package and checksum to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tarball="$(find dist -maxdepth 1 -name 'rommulus-*-linux-x86_64.tar.zst' -print -quit)"
          appimage="$(find dist -maxdepth 1 -name 'rommulus-*-linux-x86_64.AppImage' -print -quit)"
          [ -n "$tarball" ] || { echo "::error::Validated Linux tarball is missing"; exit 1; }
          [ -n "$appimage" ] || { echo "::error::Validated Linux AppImage is missing"; exit 1; }
          sha256sum "$tarball" > "${tarball}.sha256"
          sha256sum "$appimage" > "${appimage}.sha256"
          gh release upload "$RELEASE_TAG" \
            "$tarball" "${tarball}.sha256" \
            "$appimage" "${appimage}.sha256" \
            --clobber
