  # =================================================================
  # 6. core-smoke-tier-1  — STUBBED (Phase 9+)
  # =================================================================
  # TODO(phase 9): enable when Linux core builds and rommulus-player exist.
  #   This job will run the per-core smoke gate (§13.2) for Tier 1 cores
