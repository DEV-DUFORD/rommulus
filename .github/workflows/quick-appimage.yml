name: Quick AppImage + Debug APK
run-name: Quick test builds ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the filename and release tag (for example, 0.2.11-linux-preview.30)
        required: true
        type: string
      publish_prerelease:
        description: Create or update a GitHub prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: quick-appimage-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  SDL_VERSION: 3.4.14

jobs:
  build:
    name: Build AppImage and debug APK
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must resemble X.Y.Z, optionally with a prerelease suffix."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends \
            clang-18 g++ cmake ninja-build nasm pkg-config wget zstd \
            libasound2-dev libaudio-dev libdbus-1-dev libdecor-0-dev \
            libdrm-dev libegl1-mesa-dev libfribidi-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libibus-1.0-dev \
            libjack-dev libpipewire-0.3-dev libsndio-dev libsqlite3-dev \
            libthai-dev libudev-dev liburing-dev libusb-1.0-0-dev \
            libwayland-dev libx11-dev libxcursor-dev libxext-dev \
            libxfixes-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxrandr-dev libxss-dev libxtst-dev

      - name: Restore SDL3
        id: sdl-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/sdl-install
          key: sdl3-${{ env.SDL_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p deps/sdl3
          wget -qO- \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz" \
            | tar -xz -C deps/sdl3 --strip-components=1
          cmake -S deps/sdl3 -B build/sdl -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/sdl-install" \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON
          cmake --build build/sdl -j"$(( $(nproc) / 4 ))"
          cmake --install build/sdl

      - name: Build player and cores
        run: |
          set -euo pipefail
          cmake -S native/player -B build/player -G Ninja \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build/sdl-install"
          cmake --build build/player -j"$(( $(nproc) / 4 ))"

      - name: Build desktop application
        run: |
          set -euo pipefail
          ./gradlew --configure-on-demand :desktop:jar :desktop:copyRuntimeClasspath
          jlink \
            --add-modules java.base,java.datatransfer,java.desktop,java.logging,java.management,java.naming,java.net.http,java.prefs,java.sql,java.xml,jdk.crypto.ec,jdk.unsupported \
            --output build/runtime \
            --strip-debug \
            --no-header-files \
            --no-man-pages

      - name: Build Android debug APK
        run: |
          set -euo pipefail
          ./gradlew --configure-on-demand :app:assembleDebug

      - name: Prepare debug APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$apk" ] || {
            echo "::error::Debug APK was not produced at $apk."
            exit 1
          }
          mkdir -p dist
          output="dist/rommulus-${VERSION}-android-debug.apk"
          cp "$apk" "$output"
          sha256sum "$output" > "${output}.sha256"

      - name: Assemble AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          packaging/build-tarball.sh "$VERSION"

          tool="$GITHUB_WORKSPACE/build/appimagetool-1.9.1-x86_64.AppImage"
          runtime="$GITHUB_WORKSPACE/build/appimage-runtime-20251108-x86_64"
          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            -O "$tool"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tool" \
            | sha256sum --check
          chmod +x "$tool"
          wget -q \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 \
            -O "$runtime"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $runtime" \
            | sha256sum --check

          APPIMAGETOOL="$tool" APPIMAGE_RUNTIME="$runtime" \
            packaging/build-appimage.sh "$VERSION"

          appimage="dist/rommulus-${VERSION}-linux-x86_64.AppImage"
          [ -x "$appimage" ]
          [ "$(stat -c%s "$appimage")" -gt 5242880 ]
          sha256sum "$appimage" > "${appimage}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rommulus-${{ steps.version.outputs.version }}-linux-x86_64-AppImage
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rommulus-${{ steps.version.outputs.version }}-android-debug
          path: |
            dist/*-android-debug.apk
            dist/*-android-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Publish prerelease
        if: inputs.publish_prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "RomMulus $VERSION" \
              --generate-notes \
              --prerelease
          fi
          gh release upload "$TAG" \
            "dist/rommulus-${VERSION}-linux-x86_64.AppImage" \
            "dist/rommulus-${VERSION}-linux-x86_64.AppImage.sha256" \
            "dist/rommulus-${VERSION}-android-debug.apk" \
            "dist/rommulus-${VERSION}-android-debug.apk.sha256" \
            --clobber
